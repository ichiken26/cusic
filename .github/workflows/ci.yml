name: cusic CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Check Go dependency files and test
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -o ./bin/cusic ./cmd/cusic
          ./bin/cusic help
  audio-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy/SciPy dependencies
        run: python -m pip install --disable-pip-version-check -r audio/requirements.txt
      - name: Test FFT worker
        run: python -m unittest discover -s tests/python -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Test Go/Python integration
        env:
          CUSIC_PYTHON: python
        run: go test -mod=readonly ./internal/analysis ./internal/agent
  synthv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synthv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Confirm editor artifact has no runtime imports
        run: |
          test -f dist/cusic-synthv.js
          if grep -E '^import |require[(]' dist/cusic-synthv.js; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cusic-synthv-scripts
          path: |
            synthv/dist/cusic-synthv.js
            synthv/dist/cusic-synthv-safe.js
            synthv/dist/host/
  binaries:
    needs: go
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
            ext: .exe
          - os: ubuntu-latest
            name: linux-amd64
            ext: ''
          - os: macos-latest
            name: macos-arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - run: go build -mod=readonly -o cusic${{ matrix.ext }} ./cmd/cusic
      - name: Verify Windows installer registers user PATH exactly once
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $installer = Join-Path $repo 'install.cmd'
          $expected = Join-Path $repo 'bin'
          Push-Location $env:RUNNER_TEMP
          try {
            & $installer
            if ($LASTEXITCODE -ne 0) { throw "installer failed" }
            & $installer
            if ($LASTEXITCODE -ne 0) { throw "installer is not idempotent" }
          } finally {
            Pop-Location
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $matches = @($userPath -split ';' | Where-Object { $_.TrimEnd([char[]]@('\', '/')) -ieq $expected })
          if ($matches.Count -ne 1) { throw "expected exactly one registered bin PATH, got $($matches.Count)" }
          $rubberband = Join-Path $expected 'rubberband.exe'
          if (Test-Path $rubberband) {
            if ((Get-Item $rubberband).Length -eq 0) { throw "Rubber Band install produced an empty executable" }
            & $rubberband --help *> $null
            # Some CLI versions return 1 for --help; focus on launch errors.
          } elseif (-not (Get-Command rubberband -ErrorAction SilentlyContinue)) {
            throw "Rubber Band was not installed or found on PATH"
          }
          & (Join-Path $expected 'cusic.exe') help
          if ($LASTEXITCODE -ne 0) { throw "installed executable did not start" }
      - uses: actions/upload-artifact@v4
        with:
          name: cusic-${{ matrix.name }}
          path: cusic${{ matrix.ext }}
