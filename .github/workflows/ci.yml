name: cusic CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Check Go dependency files and test
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -o ./bin/cusic ./cmd/cusic
          ./bin/cusic help
  synthv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synthv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Confirm editor artifact has no runtime imports
        run: |
          test -f dist/cusic-synthv.js
          if grep -E '^import |require[(]' dist/cusic-synthv.js; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cusic-synthv-scripts
          path: |
            synthv/dist/cusic-synthv.js
            synthv/dist/cusic-synthv-safe.js
            synthv/dist/host/
  binaries:
    needs: go
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
            ext: .exe
          - os: ubuntu-latest
            name: linux-amd64
            ext: ''
          - os: macos-latest
            name: macos-arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - run: go build -mod=readonly -o cusic${{ matrix.ext }} ./cmd/cusic
      - uses: actions/upload-artifact@v4
        with:
          name: cusic-${{ matrix.name }}
          path: cusic${{ matrix.ext }}
